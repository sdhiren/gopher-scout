[project]
name = "gopher-scout"
version = "0.1.0"
description = "Multi-agent system that discovers Go open-source CLI projects, proposes deeply analysed improvements, and implements the ones you approve on local feature branches."
readme = "README.md"
authors = [
    { name = "Dhiren Singh", email = "singh.dhirendra07@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.168",
    "fastapi>=0.143.5",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.5",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
gopher-scout = "gopher_scout.cli:app"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = [
    "B008",      # FastAPI/Typer use calls in default args by design
    "ASYNC109",  # explicit subprocess timeouts are clearer than asyncio.timeout here
    "ASYNC240",  # tiny local file reads; not worth an executor hop
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["gopher_scout.web.*", "gopher_scout.cli"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
